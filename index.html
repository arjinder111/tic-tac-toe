<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe · Unbeatable AI</title>
<meta name="description" content="Tic-Tac-Toe with an unbeatable Minimax AI and local 2-player mode. Built by Arjinder Singh.">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --x:#38bdf8; --o:#f472b6; --text:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,#1e1b4b,var(--bg) 60%); color:var(--text); font-family:system-ui,-apple-system,sans-serif; padding:16px; }
  .card { background:var(--card); padding:28px 24px; border-radius:20px; width:min(100%,400px); text-align:center; box-shadow:0 20px 60px #0008; }
  h1 { font-size:1.5rem; margin-bottom:4px; } .sub { color:var(--muted); font-size:.9rem; margin-bottom:18px; }
  .modes { display:flex; gap:8px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
  button { font:inherit; border:none; border-radius:10px; padding:9px 14px; cursor:pointer; background:#334155; color:var(--text); transition:.15s; }
  button:hover { filter:brightness(1.15); } button.active { background:var(--accent); }
  .status { min-height:1.6em; font-weight:600; margin:10px 0; }
  .board { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
  .cell { aspect-ratio:1; background:var(--bg); border-radius:14px; font-size:3rem; font-weight:800; display:grid; place-items:center; cursor:pointer; transition:.15s; user-select:none; }
  .cell:hover:empty { background:#273449; } .X { color:var(--x); } .O { color:var(--o); }
  .cell.pop { animation:pop .2s ease; } @keyframes pop { from { transform:scale(.5); opacity:0; } }
  .win { background:#14532d !important; }
  .scores { display:flex; justify-content:space-around; color:var(--muted); margin:8px 0 14px; font-size:.95rem; }
  .scores b { display:block; font-size:1.3rem; color:var(--text); }
  footer { margin-top:16px; font-size:.8rem; color:var(--muted); } footer a { color:var(--x); text-decoration:none; }
</style>
</head>
<body>
<main class="card">
  <h1>❌ Tic-Tac-Toe ⭕</h1>
  <p class="sub">Can you beat the AI? (Spoiler: it never loses)</p>
  <div class="modes">
    <button data-mode="ai" class="active">🤖 vs AI</button>
    <button data-mode="pvp">👥 2 Players</button>
  </div>
  <div class="status" id="status"></div>
  <div class="board" id="board"></div>
  <div class="scores">
    <div><span class="X">X</span><b id="sX">0</b></div>
    <div>Draws<b id="sD">0</b></div>
    <div><span class="O" id="oLabel">AI (O)</span><b id="sO">0</b></div>
  </div>
  <button id="restart">↻ New Round</button>
  <footer>Built by <a href="https://github.com/arjinder111">Arjinder Singh</a> · Minimax algorithm · Vanilla JS</footer>
</main>
<script>
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const $ = (id) => document.getElementById(id);
let board, turn, over, mode = 'ai';
const scores = { X:0, O:0, D:0 };

const cells = [...Array(9)].map((_, i) => {
  const c = document.createElement('div');
  c.className = 'cell';
  c.onclick = () => play(i);
  $('board').appendChild(c);
  return c;
});

function winner(b) {
  for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { mark:b[l[0]], line:l };
  return b.every(Boolean) ? { mark:'D', line:[] } : null;
}

// Minimax: explores every possible future move and picks the best one.
// Scores prefer faster wins and slower losses (depth adjustment).
function minimax(b, player, depth) {
  const w = winner(b);
  if (w) return { score: w.mark === 'O' ? 10 - depth : w.mark === 'X' ? depth - 10 : 0 };
  let best = { score: player === 'O' ? -Infinity : Infinity };
  b.forEach((v, i) => {
    if (v) return;
    b[i] = player;
    const { score } = minimax(b, player === 'O' ? 'X' : 'O', depth + 1);
    b[i] = null;
    if (player === 'O' ? score > best.score : score < best.score) best = { score, index:i };
  });
  return best;
}

function play(i) {
  if (over || board[i] || (mode === 'ai' && turn === 'O')) return;
  place(i);
  if (!over && mode === 'ai') setTimeout(() => place(minimax(board.slice(), 'O', 0).index), 350);
}

function place(i) {
  board[i] = turn;
  cells[i].textContent = turn;
  cells[i].className = 'cell pop ' + turn;
  const w = winner(board);
  if (w) {
    over = true;
    scores[w.mark]++;
    w.line.forEach(k => cells[k].classList.add('win'));
  } else turn = turn === 'X' ? 'O' : 'X';
  render(w);
}

function render(w) {
  const oName = mode === 'ai' ? 'AI' : 'Player O';
  let msg;
  if (!w) msg = mode === 'ai' ? (turn === 'X' ? 'Your turn (X)' : 'AI is thinking…') : `Player ${turn}'s turn`;
  else if (w.mark === 'D') msg = "🤝 It's a draw!";
  else if (mode === 'ai') msg = w.mark === 'X' ? '🎉 You beat the AI!?' : '🤖 AI wins!';
  else msg = `🎉 Player ${w.mark} wins!`;
  $('status').textContent = msg;
  $('sX').textContent = scores.X; $('sO').textContent = scores.O; $('sD').textContent = scores.D;
  $('oLabel').textContent = `${oName} (O)`;
}

function reset() {
  board = Array(9).fill(null); turn = 'X'; over = false;
  cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
  render(null);
}

document.querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  mode = btn.dataset.mode;
  scores.X = scores.O = scores.D = 0;
  reset();
});
$('restart').onclick = reset;
reset();
</script>
</body>
</html>
